# [[BLOCK: General]]
set-option -g default-shell /usr/bin/zsh

unbind %
unbind '"'

setw -g mode-keys vi
set -g mode-style bg=brightblack,fg=white
set -g mouse on
set -g status-position bottom

set -g status-left "[#S] "
set -g status-left-length 40
set -g status-right ""
set -g status-right-length 0
set -g status-style bg=black,fg=white
set -g status-justify centre

set -g window-status-format "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '')"
set -g window-status-current-format "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '')"
# [[/BLOCK]]

# [[BLOCK: Mode Entry]]
# cmd: Alt+Space | desc: Copy mode (Select Mode) betreten
bind -n M-Space copy-mode
# cmd: Alt+C      | desc: Aktuelle Session killen
bind -n M-C kill-session
# cmd: WheelUp    | desc: Copy mode bei Maus-Scrollen
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
# [[/BLOCK]]

# [[BLOCK: Copy Mode Navigation]]
# cmd: C-u | desc: Page up (half screen)
# cmd: C-d | desc: Page down (half screen)
# cmd: C-b | desc: Page up (full screen)
# cmd: C-f | desc: Page down (full screen)
# cmd: w   | desc: Nächstes Wort
# cmd: b   | desc: Vorheriges Wort
# cmd: e   | desc: Ende des Wortes
# cmd: W   | desc: Nächstes Wort (whitespace)
# cmd: B   | desc: Vorheriges Wort (whitespace)
# cmd: E   | desc: Wort-Ende (whitespace)
# cmd: gg  | desc: Zeilensprung (Eingabeaufforderung)
# cmd: G   | desc: Zum Ende (history-bottom)
# cmd: H   | desc: Obere Bildschirmkante
# cmd: M   | desc: Bildschirmmitte
# cmd: L   | desc: Untere Bildschirmkante
bind -T copy-mode-vi C-u send -X page-up
bind -T copy-mode-vi C-d send -X page-down
bind -T copy-mode-vi C-b send -X page-up
bind -T copy-mode-vi C-f send -X page-down
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi e send -X next-word-end
bind -T copy-mode-vi W send -X next-space
bind -T copy-mode-vi B send -X previous-space
bind -T copy-mode-vi E send -X next-space-end
bind -T copy-mode-vi gg command-prompt -p "line:" "send -X goto-line %1"
bind -T copy-mode-vi G send -X history-bottom
bind -T copy-mode-vi H send -X top-line
bind -T copy-mode-vi M send -X middle-line
bind -T copy-mode-vi L send -X bottom-line
# [[/BLOCK]]

# [[BLOCK: Selection]]
# cmd: v    | desc: Character-wise Selection beginnen
# cmd: V    | desc: Line-wise Selection
# cmd: C-v  | desc: Block Selection
# cmd: Esc  | desc: Auswahl abbrechen
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X select-block
bind -T copy-mode-vi Escape send -X cancel
# [[/BLOCK]]

# [[BLOCK: Clipboard]]
# cmd: y     | desc: Yank (kopieren) + Cancel -> tmux + System
# cmd: Y     | desc: Yank Line -> System-Clipboard
# cmd: Enter | desc: Kopieren + Cancel -> System-Clipboard
# cmd: Alt+v | desc: Aus System-Clipboard einfügen (normal mode)
bind -T copy-mode-vi y send -X copy-selection-and-cancel \; run "tmux show-buffer | wl-copy"
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -n M-v run "tmux set-buffer \"$(wl-paste)\" \; paste-buffer"
# [[/BLOCK]]

# [[BLOCK: Search]]
# cmd: / | desc: Vorwärts suchen
# cmd: ? | desc: Rückwärts suchen
# cmd: n | desc: Nächster Treffer
# cmd: N | desc: Vorheriger Treffer
# (bereits built-in in copy-mode-vi, keine extra Bindings nötig)
# [[/BLOCK]]
